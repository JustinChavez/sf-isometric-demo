<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="San Francisco redrawn as an isometric pixel-art map — a single continuous raster, tile by tile.">
  <title>SF Isometric</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="map-only">
    <div id="map-viewport" class="map-viewport"
         role="application"
         aria-label="Interactive isometric map of San Francisco. Drag to pan, scroll or pinch to zoom, click a quadrant to inspect it.">
      <div id="map-stage" class="map-stage"></div>

      <div id="map-readout" class="map-readout" aria-live="off"></div>
      <p id="map-facts" class="map-facts"></p>

      <div class="map-controls" aria-label="Map controls">
        <button type="button" data-map-action="in" aria-label="Zoom in" title="Zoom in">+</button>
        <button type="button" data-map-action="out" aria-label="Zoom out" title="Zoom out">−</button>
        <button type="button" data-map-action="fill" aria-label="Fill the window with the map" title="Fill window (f)">↕</button>
        <button type="button" data-map-action="fit" aria-label="Fit the whole map" title="Fit all">⤢</button>
      </div>

      <p class="map-hint">drag to pan · scroll to zoom · click a piece to inspect it</p>

      <a class="map-credit" href="https://www.linkedin.com/in/justinlchavez/" target="_blank"
         rel="noreferrer me" aria-label="Made by Justin Chavez — LinkedIn profile">made by Justin Chavez</a>
    </div>
  </main>

  <dialog id="lightbox" class="lightbox">
    <figure>
      <img id="lightbox-image" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <button type="button" class="lightbox-close" onclick="document.getElementById('lightbox').close()" aria-label="Close">✕</button>
  </dialog>
</body>
</html>
